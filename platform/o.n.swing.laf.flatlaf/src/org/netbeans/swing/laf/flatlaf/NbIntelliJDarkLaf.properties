# IntelliJ "New UI" dark palette (JetBrains Int UI).

nb.preferred.color.profile=IntelliJ Dark

@background = #2B2D30
@foreground = #DFE1E5
@componentBackground = #2B2D30
@buttonBackground = #2B2D30
@menuBackground = #2B2D30
@accentBaseColor = #3574F0
@selectionBackground = if(@accentColor, @accentSelectionBackground, #2E436E)
@selectionForeground = if(@accentColor, contrast(@selectionBackground, @background, #fff, 25%), @foreground)
@selectionInactiveBackground = #43454A
@menuSelectionBackground = @selectionBackground
@menuHoverBackground = #393B40
@disabledForeground = #6F737A

TextField.selectionBackground = #214283
TextField.selectionForeground = @foreground
FormattedTextField.selectionBackground = #214283
FormattedTextField.selectionForeground = @foreground
PasswordField.selectionBackground = #214283
PasswordField.selectionForeground = @foreground
TextArea.selectionBackground = #214283
TextArea.selectionForeground = @foreground
TextPane.selectionBackground = #214283
TextPane.selectionForeground = @foreground
EditorPane.selectionBackground = #214283
EditorPane.selectionForeground = @foreground

Component.borderColor = #4E5157
Component.disabledBorderColor = #43454A
Component.focusedBorderColor = @accentFocusColor
Separator.foreground = #1E1F22
PopupMenu.borderColor = #43454A
MenuBar.borderColor = #1E1F22
ToolTip.background = #2B2D30
ToolTip.border = 6,8,6,8,#43454A
Button.default.background = @accentBaseColor
Button.default.foreground = #FFFFFF
Button.default.borderColor = @accentBaseColor
Button.default.hoverBackground = #467FF2
Button.borderColor = #4E5157
Button.toolbar.hoverBackground = #393B40
Button.toolbar.pressedBackground = #43454A
TextField.background = #2B2D30
ScrollBar.track = #00000000
ScrollBar.thumb = #4E5157
ScrollBar.hoverThumbColor = #5A5D63

Tree.background = @background
Panel.background = @background

TabbedContainer.editor.contentBorderColor = #1E1F22
TabbedContainer.view.contentBorderColor = #1E1F22
controlShadow = #1E1F22
nb.multitabs.gridColor = #1E1F22

#---- EditorView ----

Nb.EmptyEditorArea.background = #1E1F22

#---- EditorTab ----

EditorTab.background = #1E1F22
EditorTab.foreground = #CED0D6
EditorTab.activeBackground = $EditorTab.background
EditorTab.activeForeground = $EditorTab.foreground
EditorTab.selectedBackground = #1E1F22
EditorTab.selectedForeground = #DFE1E5
EditorTab.hoverBackground = #2B2D30
EditorTab.selectedHoverBackground = $EditorTab.selectedBackground
EditorTab.hoverForeground = #DFE1E5
EditorTab.underlineColor = @accentUnderlineColor
EditorTab.inactiveUnderlineColor = #5A5D63
EditorTab.tabSeparatorColor = #1E1F22

#---- ViewTab ----

ViewTab.background = @background
ViewTab.foreground = #B4B8BF
ViewTab.activeBackground = $ViewTab.background
ViewTab.activeForeground = $ViewTab.foreground
ViewTab.selectedBackground = @background
ViewTab.selectedForeground = #DFE1E5
ViewTab.hoverBackground = #393B40
ViewTab.selectedHoverBackground = $ViewTab.hoverBackground
ViewTab.hoverForeground = #DFE1E5
ViewTab.underlineColor = @accentUnderlineColor
ViewTab.inactiveUnderlineColor = #5A5D63
ViewTab.tabSeparatorColor = #1E1F22

SlidingButton.hoverBackground = #393B40
SlidingButton.selectedBackground = #43454A

TabControlIcon.foreground = #9DA0A8
TabControlIcon.close.rolloverBackground = #43454A
TabControlIcon.close.rolloverForeground = #DFE1E5

#---- Misc NetBeans components ----

PropSheet.setBackground = #393B40
nb.output.background = #1E1F22
nb.output.backgorund = #1E1F22
nb.output.foreground = #BCBEC4
nb.output.selectionBackground = 
nb.heapview.background = @background
nb.startpage.defaultbackground = true

#---- Geometry (shared with the other IntelliJ variant) ----

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4

Tree.rowHeight = 24
Tree.selectionArc = 8
Tree.selectionInsets = 0,4,0,4
List.selectionArc = 8
List.selectionInsets = 0,4,0,4
Table.rowHeight = 24
Table.showVerticalLines = false

MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
PopupMenu.borderInsets = 6,1,6,1
Popup.borderCornerRadius = 8

ScrollBar.width = 12
ScrollBar.thumbInsets = 3,3,3,3

TabbedPane.tabType = underlined
TabbedPane.tabHeight = 32
TabbedPane.underlineHeight = 2

#---- Editor and view tabs: underline at the bottom, no separators ----

EditorTab.tabInsets = 6,10,6,6
EditorTab.underlineHeight = 2
EditorTab.underlineAtTop = false
EditorTab.showTabSeparators = false
EditorTab.showSelectedTabBorder = false
ViewTab.tabInsets = 6,10,6,6
ViewTab.underlineHeight = 2
ViewTab.underlineAtTop = false
ViewTab.showTabSeparators = false
ViewTab.showSelectedTabBorder = false
nb.multitabs.showVerticalLines = false
TabControlIcon.arc = 4

