# IntelliJ "New UI" light palette (JetBrains Int UI).

nb.preferred.color.profile=IntelliJ Light

@background = #F7F8FA
@foreground = #000000
@componentBackground = #FFFFFF
@buttonBackground = #FFFFFF
@menuBackground = #FFFFFF
@accentBaseColor = #3574F0
@selectionBackground = if(@accentColor, @accentSelectionBackground, #D4E2FF)
@selectionForeground = if(@accentColor, contrast(@selectionBackground, @foreground, #fff), @foreground)
@selectionInactiveBackground = #DFE1E5
@menuSelectionBackground = @selectionBackground
@menuHoverBackground = #EBECF0

TextField.selectionBackground = #A6D2FF
TextField.selectionForeground = @foreground
FormattedTextField.selectionBackground = #A6D2FF
FormattedTextField.selectionForeground = @foreground
PasswordField.selectionBackground = #A6D2FF
PasswordField.selectionForeground = @foreground
TextArea.selectionBackground = #A6D2FF
TextArea.selectionForeground = @foreground
TextPane.selectionBackground = #A6D2FF
TextPane.selectionForeground = @foreground
EditorPane.selectionBackground = #A6D2FF
EditorPane.selectionForeground = @foreground

Component.borderColor = #C9CCD6
Component.disabledBorderColor = #DFE1E5
Component.focusedBorderColor = @accentFocusColor
Separator.foreground = #EBECF0
PopupMenu.borderColor = #DFE1E5
MenuBar.borderColor = #EBECF0
ToolTip.background = #FFFFFF
ToolTip.border = 6,8,6,8,#DFE1E5
Button.default.background = @accentBaseColor
Button.default.foreground = #FFFFFF
Button.default.borderColor = @accentBaseColor
Button.default.hoverBackground = #4682FA
Button.borderColor = #C9CCD6
Button.toolbar.hoverBackground = #DFE1E5
Button.toolbar.pressedBackground = #C9CCD6
ScrollBar.track = #00000000
ScrollBar.thumb = #C9CCD6
ScrollBar.hoverThumbColor = #A8ADBD

Tree.background = @background
Panel.background = @background

TabbedContainer.editor.contentBorderColor = #EBECF0
TabbedContainer.view.contentBorderColor = #EBECF0
controlShadow = #EBECF0
nb.multitabs.gridColor = #EBECF0

#---- EditorView ----

Nb.EmptyEditorArea.background = #FFFFFF

#---- EditorTab ----

EditorTab.background = #F7F8FA
EditorTab.foreground = #000000
EditorTab.activeBackground = $EditorTab.background
EditorTab.activeForeground = $EditorTab.foreground
EditorTab.selectedBackground = #FFFFFF
EditorTab.selectedForeground = #000000
EditorTab.hoverBackground = #EBECF0
EditorTab.selectedHoverBackground = $EditorTab.selectedBackground
EditorTab.hoverForeground = #000000
EditorTab.underlineColor = @accentUnderlineColor
EditorTab.inactiveUnderlineColor = #A8ADBD

#---- ViewTab ----

ViewTab.background = @background
ViewTab.foreground = #494B57
ViewTab.activeBackground = $ViewTab.background
ViewTab.activeForeground = $ViewTab.foreground
ViewTab.selectedBackground = @background
ViewTab.selectedForeground = #000000
ViewTab.hoverBackground = #EBECF0
ViewTab.selectedHoverBackground = $ViewTab.hoverBackground
ViewTab.hoverForeground = #000000
ViewTab.underlineColor = @accentUnderlineColor
ViewTab.inactiveUnderlineColor = #A8ADBD

SlidingButton.selectedBackground = #DFE1E5

TabControlIcon.foreground = #6C707E
TabControlIcon.close.rolloverBackground = #DFE1E5
TabControlIcon.close.rolloverForeground = #000000

#---- Misc NetBeans components ----

PropSheet.setBackground = #EBECF0
nb.output.background = #FFFFFF
nb.output.selectionBackground = 
nb.heapview.background = @background
nb.quicksearch.border = 1,1,1,1,#DFE1E5

#---- Geometry (shared with the other IntelliJ variant) ----

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4

Tree.rowHeight = 24
Tree.selectionArc = 8
Tree.selectionInsets = 0,4,0,4
List.selectionArc = 8
List.selectionInsets = 0,4,0,4
Table.rowHeight = 24
Table.showVerticalLines = false

MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
PopupMenu.borderInsets = 6,1,6,1
Popup.borderCornerRadius = 8

ScrollBar.width = 12
ScrollBar.thumbInsets = 3,3,3,3

TabbedPane.tabType = underlined
TabbedPane.tabHeight = 32
TabbedPane.underlineHeight = 2

#---- Editor and view tabs: underline at the bottom, no separators ----

EditorTab.tabInsets = 6,10,6,6
EditorTab.underlineHeight = 2
EditorTab.underlineAtTop = false
EditorTab.showTabSeparators = false
EditorTab.showSelectedTabBorder = false
ViewTab.tabInsets = 6,10,6,6
ViewTab.underlineHeight = 2
ViewTab.underlineAtTop = false
ViewTab.showTabSeparators = false
ViewTab.showSelectedTabBorder = false
nb.multitabs.showVerticalLines = false
TabControlIcon.arc = 4

